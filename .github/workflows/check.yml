# Runs the safety check every time something is pushed to GitHub.
# If the check fails, GitHub shows a red X next to the commit.

name: Site check

on:
  push:
  pull_request:

# This job only needs to read the code. It gets no other access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
